<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Converter API - Usage Stats</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: white; text-align: center; margin-bottom: 30px; }
        .card { background: white; padding: 25px; border-radius: 12px; margin: 15px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .stat { font-size: 3em; color: #667eea; font-weight: bold; text-align: center; }
        .label { color: #666; text-align: center; margin-top: 10px; font-size: 1.1em; }
        .refresh { text-align: center; margin-top: 20px; }
        .refresh button { background: #667eea; color: white; border: none; padding: 10px 30px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .refresh button:hover { background: #5a6fd6; }
        .api-endpoints { margin-top: 30px; }
        .api-endpoints h2 { color: white; margin-bottom: 15px; }
        .endpoint { background: white; padding: 15px; border-radius: 8px; margin: 10px 0; }
        .endpoint code { color: #667eea; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 PDF Converter API - Usage Statistics</h1>
        
        <div class="card">
            <div class="stat" id="totalRequests">-</div>
            <div class="label">Total Requests</div>
        </div>
        
        <div class="card">
            <div class="stat" id="totalConversions">-</div>
            <div class="label">Total Conversions</div>
        </div>
        
        <div class="card">
            <div class="stat" id="totalMerges">-</div>
            <div class="label">Total Merges</div>
        </div>
        
        <div class="refresh">
            <button onclick="loadStats()">🔄 Refresh</button>
        </div>
        
        <div class="api-endpoints">
            <h2>📡 API Endpoints</h2>
            <div class="endpoint"><code>GET /api/health</code> - Health Check</div>
            <div class="endpoint"><code>POST /api/upload</code> - Upload PDF</div>
            <div class="endpoint"><code>POST /api/convert</code> - Convert PDF</div>
            <div class="endpoint"><code>POST /api/merge</code> - Merge PDFs</div>
            <div class="endpoint"><code>GET /api/stats</code> - Usage Statistics</div>
        </div>
    </div>
    
    <script>
        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('totalRequests').textContent = data.totalRequests || 0;
                document.getElementById('totalConversions').textContent = data.totalConversions || 0;
                document.getElementById('totalMerges').textContent = data.totalMerges || 0;
            } catch (e) {
                console.error('Failed to load stats:', e);
            }
        }
        loadStats();
    </script>
</body>
</html>
